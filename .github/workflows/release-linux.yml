name: Linux-Release (.deb)

# Baut bei jeder Änderung an der App auf main das .deb-Paket und veröffentlicht es
# als GitHub-Release v<version aus package.json>. Fester Download-Link (immer neueste Version):
# https://github.com/tringl-a/tringl/releases/latest/download/TradingJournal-linux-amd64.deb
on:
  push:
    branches: [main]
    paths: ["app/**", "main.js", "package.json", "build-deb.js", ".github/workflows/release-linux.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-linux
  cancel-in-progress: false

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build-Werkzeuge
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg

      - name: Abhängigkeiten
        run: npm install --no-audit --no-fund

      - name: .deb bauen
        run: npm run build-deb

      - name: Version und Dateinamen
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp "dist/installers/tradingjournal_${VERSION}_amd64.deb" dist/installers/TradingJournal-linux-amd64.deb
          ls -la dist/installers

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: Trading Journal ${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Download (Linux, .deb):** TradingJournal-linux-amd64.deb unten unter „Assets“.

            Installieren: Datei im Dateimanager doppelklicken bzw. Rechtsklick → *Öffnen mit → Discover* → **Installieren**.
            Alternativ im Terminal: `sudo apt install ./TradingJournal-linux-amd64.deb`

            Deine Daten bleiben beim Update erhalten.
          files: |
            dist/installers/TradingJournal-linux-amd64.deb
            dist/installers/tradingjournal_${{ steps.meta.outputs.version }}_amd64.deb
